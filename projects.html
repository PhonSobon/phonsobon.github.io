<script>
(function(){
  const list = document.getElementById('allProjects');
  const filters = document.getElementById('filters');
  document.getElementById('projectCount').textContent = PROJECTS.length + ' projects in';

  const cats = [['all', 'All']].concat(Object.entries(PROJECT_CATEGORIES));
  filters.innerHTML = cats.map(([key, label]) => {
    const n = key === 'all' ? PROJECTS.length : PROJECTS.filter(p => p.category === key).length;
    return `<button type="button" data-filter="${key}" aria-pressed="false"><span class="f-label">${label}</span><span class="f-count" aria-label="${n} entries">${n}</span></button>`;
  }).join('');

  function apply(key){
    filters.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === key)));
    renderProjectList(list, key === 'all' ? PROJECTS : PROJECTS.filter(p => p.category === key));
    try{ history.replaceState(null, '', key === 'all' ? location.pathname : '#' + key); }catch(e){}
  }

  filters.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(b) apply(b.dataset.filter);
  });

  const initial = location.hash.slice(1);
  apply(PROJECT_CATEGORIES[initial] ? initial : 'all');
})();
</script>
